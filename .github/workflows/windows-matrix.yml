name: windows matrix

# Runs the native reproducers against the kernel of each Windows medium listed in ci/windows-images.json, by
# booting the medium's Windows PE in QEMU on a GitHub-hosted Linux runner: x64 under KVM, Arm64 emulated (with
# SVE). Each medium is downloaded inside its job, verified, and never stored; only text results are uploaded.

on:
  push:
    branches: [ci-windows-matrix]
  workflow_dispatch:

jobs:
  setup:
    name: read the manifest, build the probes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Matrix
        id: matrix
        run: |
          jq -c '[.images[] as $i | ($i.configurations // ["none"])[] as $c
                  | {name: $i.name, arch: $i.arch, type: $i.type, url: $i.url, sha1: ($i.sha1 // ""),
                     boot: ($i.boot // "uefi"), override: $c}]
                 | to_entries | map(.value + {id: .key})' ci/windows-images.json > matrix.json
          jq -r '.[] | "\(.id)\t\(.arch)\t\(.name)\t\(.override)"' matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Toolchain (llvm-mingw, msvcrt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh release view -R mstorsjo/llvm-mingw --json assets -q '.assets[].url' | grep -E 'msvcrt-ubuntu-[0-9.]+-x86_64\.tar\.xz$' | head -1)
          echo "$url"
          curl -fsSL "$url" | tar -xJ
          echo "$PWD/$(ls -d llvm-mingw-*/ | head -1)bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          mkdir -p probes/x64 probes/arm64
          x86_64-w64-mingw32-clang -O2 -mxsave -o probes/x64/probe.exe native/xstate_stale_header.c -ladvapi32 -lversion
          x86_64-w64-mingw32-clang -O2 -o probes/x64/kernel_ids.exe native/kernel_ids.c -lversion
          aarch64-w64-mingw32-clang -O2 -o probes/arm64/probe.exe native/sve_stale_header.c
          aarch64-w64-mingw32-clang -O2 -o probes/arm64/kernel_ids.exe native/kernel_ids.c -lversion
          ls -l probes/*
      - uses: actions/upload-artifact@v4
        with:
          name: probes
          path: probes
          retention-days: 7

  vm:
    name: ${{ matrix.arch }}, ${{ matrix.name }}, ${{ matrix.override == 'none' && 'as shipped' || format('override {0}', matrix.override) }}
    needs: setup
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: probes
          path: probes
      - name: Host
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          free -g | head -2; df -h / /mnt 2>/dev/null || df -h /
      - name: Allow KVM for the runner user
        if: matrix.arch == 'x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wimtools mtools dosfstools genisoimage libhivex-bin libwin-hivex-perl \
            ${{ matrix.arch == 'x64' && 'qemu-system-x86 ovmf' || 'qemu-system-arm qemu-efi-aarch64' }} > /dev/null
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
      - name: Run
        env:
          WORK: /mnt/work
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          TYPE: ${{ matrix.type }}
          URL: ${{ matrix.url }}
          SHA1: ${{ matrix.sha1 }}
          BOOT: ${{ matrix.boot }}
          OVERRIDE: ${{ matrix.override }}
          LIMIT: ${{ matrix.arch == 'x64' && '1500' || '10800' }}
        run: bash ci/winpe-vm.sh
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat out/result.txt 2>/dev/null || echo "no result line"
            grep -E '^(Microsoft Windows|KVER|cpu|xcr0|vector state|RESULT|SVE vector|PF_ARM|pattern|PROBE-EXIT| *EnabledState)' out/out.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id }}
          path: out
          retention-days: 30

  summary:
    name: collect the results
    needs: vm
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Collect
        run: |
          printf 'version\tarch\tkernel file version\tclass-222 version\tconfiguration\tfeature state\tcpu\tresult\n' > summary.tsv
          cat results/*/result.txt | sort -t "$(printf '\t')" -k2,2 -k3,3Vr -k5,5 >> summary.tsv || true
          {
            echo "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            cat summary.tsv
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.tsv
          retention-days: 90

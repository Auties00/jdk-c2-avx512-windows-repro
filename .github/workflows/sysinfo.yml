name: sysinfo

# Prints the build and the symbol-server identifiers of the kernel and ntdll of the runner images.

on:
  workflow_dispatch:

jobs:
  sysinfo:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          cmd //c ver
          python .github/scripts/pe_ids.py C:/Windows/System32/ntoskrnl.exe C:/Windows/System32/ntdll.dll C:/Windows/System32/KernelBase.dll C:/Windows/System32/hal.dll
